general:
  use_uvloop: true

embedders:
  milvus_embedder:
    _type: nim
    model_name: nvidia/nv-embedqa-e5-v5
    truncate: "END"

retrievers:
  my_retriever:
    _type: milvus_retriever
    uri: http://localhost:19530
    collection_name: "my_docs"
    embedding_model: milvus_embedder
    top_k: 3

# Memory configuration commented out - requires MEM0_API_KEY environment variable
# Uncomment and set MEM0_API_KEY if you need memory functionality
# memory:
#   chat_memory:
#     _type: mem0_memory
#     memory_key: "chat_history"
#     api_key: $MEM0_API_KEY
#     max_tokens: 4000
#     return_messages: true

# LLMs - Must be defined before functions that use them
llms:  
  reasoning_llm: 
    _type: nim 
    model_name: deepseek-ai/deepseek-r1
    max_tokens: 4096
    temperature: 0.2
    api_key: $DEEPSEEK_R1_API_KEY
  code_generation_llm:
    _type: nim 
    model_name: qwen/qwen2.5-coder-32b-instruct 
    max_tokens: 2048
    api_key: $QWEN2_5_CODER_32B_INSTRUCT_API_KEY
  nim_llm:
    _type: nim
    model_name: meta/llama-3.1-70b-instruct
    max_tokens: 4096
    api_key: $NVIDIA_API_KEY
  general_llm:
    _type: nim 
    model_name: meta/llama-3.1-8b-instruct  
    max_tokens: 4096
    api_key: $LLAMA3_1_8B_INSTRUCT_API_KEY

functions:
  wikipedia_search:
    _type: wiki_search
    max_results: 2
  web_search:
    _type: nat.plugins.langchain.tools/tavily_internet_search
  my_retriever_tool:
    _type: nat_retriever
    retriever: my_retriever
    topic: Retrieve company documents
  code_generation_tool:
    _type: code_generation
    llm_name: code_generation_llm
    verbose: true
    programming_language: ["Python", "JavaScript", "TypeScript", "Java", "C++", "C#", "Go", "Rust", "Swift", "Kotlin", "PHP", "Ruby", "Scala", "Haskell", "Clojure", "R", "MATLAB", "Julia", "Dart", "Lua", "Perl", "Shell", "Bash", "PowerShell", "SQL", "HTML", "CSS", "XML", "YAML", "JSON"]
    description: "Multi-language code generation tool. Supports Python, JavaScript, TypeScript, Java, C++, C#, Go, Rust, Swift, Kotlin, PHP, Ruby, Scala, Haskell, and many more programming languages. For any questions about code generation, you must only use this tool!"

  save_file_code:
    _type: save_file_code
    description: "Save successfully executed and debugged code to a file. Use this AFTER code has been tested and works correctly. Files will be saved to output/project_name/"
    verbose: true
  file_reader:
    _type: file_reader
    description: "Read text content from a file path for downstream agents."

# Multi-Agent System (MAS) - 4 specialized agents

  product_manager:
    _type: react_agent
    tool_names: [save_file_code]
    llm_name: nim_llm
    verbose: true
    retry_agent_response_parsing_errors: true
    parse_agent_response_max_retries: 3
    tool_call_max_retries: 2
    max_iterations: 30
    description: "Product Manager - Analyze requirements and create detailed product specifications"
    system_prompt: |
      Product Manager persona for MAS workflow. Coordinator will supply detailed instructions.
      AVAILABLE TOOLS: {tools}
      TOOL NAMES: {tool_names}
      QUALITY GUARDRAILS:
        - Provide specific, measurable success criteria and delivery timelines.
        - Align PRODUCTS, CATEGORIES, and SORT_OPTIONS exactly with customer requirements.
        - Never use placeholder items ("Product 1") or omit shared header/footer/cart constraints.

  architect:
    _type: react_agent
    tool_names: [file_reader, save_file_code]
    llm_name: nim_llm
    verbose: true
    retry_agent_response_parsing_errors: true
    parse_agent_response_max_retries: 3
    tool_call_max_retries: 2
    max_iterations: 30
    description: "System Architect - Design system architecture and technical specifications"
    system_prompt: |
      System Architect persona for MAS workflow. Coordinator will supply detailed instructions.
      AVAILABLE TOOLS: {tools}
      TOOL NAMES: {tool_names}
      QUALITY GUARDRAILS:
        - Copy REQUIREMENTS/PRODUCTS/CATEGORIES/SORT_OPTIONS verbatim from the PM content.
        - FILE_REQUIREMENTS must list per-file responsibilities plus shared header/footer/cart assets.
        - Explicitly state that HTML must link shared styles.css/script.js and forbid inline CSS/JS.

  project_manager:
    _type: react_agent
    tool_names: [file_reader, save_file_code]
    llm_name: nim_llm
    verbose: true
    retry_agent_response_parsing_errors: true
    parse_agent_response_max_retries: 3
    tool_call_max_retries: 2
    max_iterations: 30
    description: "Project Manager - Create project plan and task breakdown"
    system_prompt: |
      Project Manager persona for MAS workflow. Coordinator will supply detailed instructions.
      AVAILABLE TOOLS: {tools}
      TOOL NAMES: {tool_names}
      QUALITY GUARDRAILS:
        - STEPS must restate the overall context plus the exact FILE_REQUIREMENTS bullet for that file.
        - Reference shared assets (header, footer, nav, cart, styles.css, script.js) wherever applicable.
        - Ensure each constraint is a full sentence with concrete expectations (no generic restatements).

  engineer:
    _type: react_agent
    tool_names: [file_reader, code_generation_tool, save_file_code]
    llm_name: nim_llm
    verbose: true
    retry_agent_response_parsing_errors: true
    parse_agent_response_max_retries: 5
    tool_call_max_retries: 3  
    max_iterations: 30
    description: "Software Engineer - Generate and save code files"
    system_prompt: |
      Software Engineer persona for MAS workflow. Coordinator will supply detailed instructions.
      AVAILABLE TOOLS: {tools}
      TOOL NAMES: {tool_names}

  tester:
    _type: react_agent
    tool_names: [file_reader, save_file_code]
    llm_name: nim_llm
    verbose: true
    retry_agent_response_parsing_errors: true
    parse_agent_response_max_retries: 3
    tool_call_max_retries: 2
    max_iterations: 30
    description: "QA Tester - Validate generated artifacts and report findings"
    system_prompt: |
      QA Tester persona for MAS workflow. Coordinator will supply detailed instructions.
      AVAILABLE TOOLS: {tools}
      TOOL NAMES: {tool_names}
      QUALITY GUARDRAILS:
        - Use file_reader on every artifact referenced (HTML, CSS, JS, docs) before making assertions.
        - Record findings with explicit severity labels and cite the requirement being verified.
        - If a required artifact is missing or unreadable, mark it as High severity immediately.
        - Conclude with clear PASS/FAIL language in SIGN_OFF.

  # Phase functions that wrap agents and handle file I/O
  product_manager_phase:
    _type: nat_mas_agents/product_manager_phase
    product_manager: product_manager

  architect_phase:
    _type: nat_mas_agents/architect_phase
    architect: architect

  project_manager_phase:
    _type: nat_mas_agents/project_manager_phase
    project_manager: project_manager

  engineer_phase:
    _type: nat_mas_agents/engineer_phase
    engineer: engineer
    
  tester_phase:
    _type: nat_mas_agents/tester_phase
    tester: tester

# Multi-Agent System Workflow
workflow:
  _type: nat_mas_agents/mas_workflow
  description: "MAS coordinator implemented in nat_mas_agents plugin - chains 4 phase functions sequentially"
  product_manager: product_manager_phase
  architect: architect_phase
  project_manager: project_manager_phase
  engineer: engineer_phase
  tester: tester_phase