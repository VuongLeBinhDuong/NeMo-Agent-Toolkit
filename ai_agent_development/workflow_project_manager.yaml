general:
  use_uvloop: true

llms:
  general_llm:
    _type: nim
    model_name: meta/llama-3.1-8b-instruct
    max_tokens: 4096
    api_key: $LLAMA3_1_8B_INSTRUCT_API_KEY

functions:
  save_file_code:
    _type: save_file_code
    description: "Save successfully executed and debugged code to a file."
    verbose: true
  file_reader:
    _type: file_reader
    description: "Read text content from a file path for downstream agents."
  project_manager:
    _type: react_agent
    tool_names: [file_reader, save_file_code]
    llm_name: general_llm
    verbose: true
    max_iterations: 30
    description: "Project Manager - Create project plan and task breakdown"
    system_prompt: |
      Project Manager persona for MAS workflow. Coordinator will supply detailed instructions.
      AVAILABLE TOOLS: {tools}
      TOOL NAMES: {tool_names}

workflow:
  _type: nat_mas_agents/project_manager_phase
  project_manager: project_manager

