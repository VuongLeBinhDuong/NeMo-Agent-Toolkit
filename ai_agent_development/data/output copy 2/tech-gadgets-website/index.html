<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Gadgets Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        header {
            background-color: #333;
            color: #fff;
            padding: 10px 0;
            text-align: center;
        }
        nav {
            display: flex;
            justify-content: center;
            background-color: #444;
        }
        nav a {
            color: #fff;
            padding: 14px 20px;
            text-decoration: none;
            text-align: center;
        }
        nav a:hover {
            background-color: #575757;
        }
        .search-bar {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }
        .search-bar input {
            padding: 10px;
            width: 80%;
            max-width: 600px;
        }
        .search-bar button {
            padding: 10px 20px;
            background-color: #333;
            color: #fff;
            border: none;
            cursor: pointer;
        }
        .search-bar button:hover {
            background-color: #575757;
        }
        .hero-banner {
            background-image: url('hero-banner.jpg');
            background-size: cover;
            background-position: center;
            height: 400px;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .hero-banner h1 {
            font-size: 3em;
            margin: 0;
        }
        .featured-products {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            padding: 20px;
        }
        .product {
            background-color: #f4f4f4;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin: 10px;
            padding: 20px;
            width: 30%;
            box-sizing: border-box;
            transition: transform 0.2s;
        }
        .product:hover {
            transform: scale(1.05);
        }
        .product img {
            max-width: 100%;
            height: auto;
            border-radius: 5px;
        }
        .product h2 {
            font-size: 1.5em;
            margin: 10px 0;
        }
        .product p {
            margin: 5px 0;
        }
        @media (max-width: 768px) {
            .product {
                width: 45%;
            }
        }
        @media (max-width: 480px) {
            .product {
                width: 90%;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Tech Gadgets</h1>
    </header>
    <nav>
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
    <div class="search-bar">
        <input type="text" placeholder="Search for products...">
        <button>Search</button>
    </div>
    <div class="hero-banner">
        <h1>Latest Tech Gadgets</h1>
    </div>
    <div class="featured-products">
        <div class="product">
            <img src="product1.jpg" alt="Product 1">
            <h2>Smartphone XYZ</h2>
            <p>Latest model with advanced features.</p>
        </div>
        <div class="product">
            <img src="product2.jpg" alt="Product 2">
            <h2>Laptop ABC</h2>
            <p>High performance laptop for professionals.</p>
        </div>
        <div class="product">
            <img src="product3.jpg" alt="Product 3">
            <h2>Smart Watch DEF</h2>
            <p>Stay connected with this stylish smartwatch.</p>
        </div>
    </div>
    <script>
        // Vanilla JavaScript can be added here for interactivity
    </script>
</body>
</html>
