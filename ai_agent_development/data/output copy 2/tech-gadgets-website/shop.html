<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Gadgets Shop</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #333;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .cart-info {
            cursor: pointer;
        }
        .shop-container {
            padding: 20px;
        }
        .filters {
            margin-bottom: 20px;
        }
        .filters select, .filters input {
            margin-right: 10px;
        }
        .product-list {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .product-item {
            border: 1px solid #ddd;
            padding: 10px;
            width: calc(33.333% - 40px);
            box-sizing: border-box;
        }
        .product-item img {
            max-width: 100%;
            height: auto;
        }
        .cart {
            position: fixed;
            top: 50px;
            right: 20px;
            background-color: white;
            border: 1px solid #ddd;
            padding: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            display: none;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .cart-total {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header>
        <h1>Tech Gadgets Shop</h1>
        <div class="cart-info" onclick="toggleCart()">Cart (<span id="cart-count">0</span>) - Subtotal: $<span id="cart-subtotal">0.00</span></div>
    </header>
    <div class="shop-container">
        <div class="filters">
            <select id="category-filter">
                <option value="all">All Categories</option>
                <option value="laptops">Laptops</option>
                <option value="smartphones">Smartphones</option>
                <option value="tablets">Tablets</option>
                <option value="accessories">Accessories</option>
            </select>
            <input type="text" id="search-input" placeholder="Search...">
            <select id="sort-by">
                <option value="name">Name</option>
                <option value="price">Price</option>
            </select>
        </div>
        <div class="product-list" id="product-list">
            <!-- Products will be dynamically inserted here -->
        </div>
    </div>
    <div class="cart" id="cart">
        <h2>Shopping Cart</h2>
        <div id="cart-items">
            <!-- Cart items will be dynamically inserted here -->
        </div>
        <div class="cart-total">Total: $<span id="cart-total">0.00</span></div>
    </div>

    <script>
        const products = [
            { id: 1, name: 'Laptop XYZ', category: 'laptops', price: 999.99, image: 'laptop.jpg' },
            { id: 2, name: 'Smartphone ABC', category: 'smartphones', price: 499.99, image: 'smartphone.jpg' },
            { id: 3, name: 'Tablet DEF', category: 'tablets', price: 299.99, image: 'tablet.jpg' },
            { id: 4, name: 'Headphones GHI', category: 'accessories', price: 99.99, image: 'headphones.jpg' },
            // Add more products as needed
        ];

        let cart = JSON.parse(localStorage.getItem('cart')) || {};

        function renderProducts() {
            const category = document.getElementById('category-filter').value;
            const search = document.getElementById('search-input').value.toLowerCase();
            const sortBy = document.getElementById('sort-by').value;

            let filteredProducts = products.filter(product => 
                (category === 'all' || product.category === category) && 
                product.name.toLowerCase().includes(search)
            );

            if (sortBy === 'price') {
                filteredProducts.sort((a, b) => a.price - b.price);
            } else {
                filteredProducts.sort((a, b) => a.name.localeCompare(b.name));
            }

            const productList = document.getElementById('product-list');
            productList.innerHTML = '';

            filteredProducts.forEach(product => {
                const productItem = document.createElement('div');
                productItem.className = 'product-item';
                productItem.innerHTML = `
                    <img src="${product.image}" alt="${product.name}">
                    <h3>${product.name}</h3>
                    <p>Price: $${product.price.toFixed(2)}</p>
                    <button onclick="addToCart(${product.id})">Add to Cart</button>
                `;
                productList.appendChild(productItem);
            });
        }

        function addToCart(productId) {
            if (cart[productId]) {
                cart[productId]++;
            } else {
                cart[productId] = 1;
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCart();
        }

        function updateCart() {
            const cartItems = document.getElementById('cart-items');
            cartItems.innerHTML = '';
            let total = 0;

            for (const productId in cart) {
                const product = products.find(p => p.id === parseInt(productId));
                const cartItem = document.createElement('div');
                cartItem.className = 'cart-item';
                cartItem.innerHTML = `
                    <span>${product.name} x ${cart[productId]}</span>
                    <span>$${(product.price * cart[productId]).toFixed(2)}</span>
                `;
                cartItems.appendChild(cartItem);
                total += product.price * cart[productId];
            }

            document.getElementById('cart-count').textContent = Object.keys(cart).reduce((sum, key) => sum + cart[key], 0);
            document.getElementById('cart-subtotal').textContent = total.toFixed(2);
            document.getElementById('cart-total').textContent = total.toFixed(2);
        }

        function toggleCart() {
            const cart = document.getElementById('cart');
            cart.style.display = cart.style.display === 'block' ? 'none' : 'block';
        }

        document.getElementById('category-filter').addEventListener('change', renderProducts);
        document.getElementById('search-input').addEventListener('input', renderProducts);
        document.getElementById('sort-by').addEventListener('change', renderProducts);

        renderProducts();
        updateCart();
    </script>
</body>
</html>
