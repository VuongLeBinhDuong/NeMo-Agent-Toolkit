general:
  use_uvloop: true

embedders:
  milvus_embedder:
    _type: nim
    model_name: nvidia/nv-embedqa-e5-v5
    truncate: "END"

retrievers:
  my_retriever:
    _type: milvus_retriever
    uri: http://localhost:19530
    collection_name: "my_docs"
    embedding_model: milvus_embedder
    top_k: 3

memory:
  chat_memory:
    _type: mem0_memory
    memory_key: "chat_history"
    api_key: $MEM0_API_KEY
    max_tokens: 4000
    return_messages: true

functions:
  calculator_multiply:
    _type: calculator_multiply
  calculator_inequality:
    _type: calculator_inequality
  calculator_divide:
    _type: nat_simple_calculator/calculator_divide
  current_datetime:
    _type: current_datetime
  calculator_subtract:
    _type: calculator_subtract
  wikipedia_search:
    _type: wiki_search
    max_results: 2
  web_search:
    _type: nat.plugins.langchain.tools/tavily_internet_search
  my_retriever_tool:
    _type: nat_retriever
    retriever: my_retriever
    topic: Retrieve company documents
  code_generation_tool:
    _type: code_generation
    llm_name: code_generation_llm
    programming_language: "Python"
    description: "Generate clean, executable Python code with exactly 3 test cases. Format the output as follows:

      1. Start with a clear comment explaining what the code does
      2. Define the main function with proper implementation  
      3. Include exactly 3 test cases with different scenarios
      4. Add a main execution block that runs all tests and displays results clearly

      Example format:
      ```python
      # Function to check if a number is a palindrome
      def is_palindrome(x):
          return str(x) == str(x)[::-1]

      # Test cases - EXACTLY 3 CASES
      test_cases = [121, -121, 10]
      results = {}

      for x in test_cases:
          results[x] = is_palindrome(x)

      # Display results
      for x, result in results.items():
          print(f'is_palindrome({x}) = {result}')
      ```

      CRITICAL: Code must be executable and produce clear output showing test results. ALWAYS include exactly 3 test cases only."
    verbose: true
    
  code_gen_tool:
    _type: code_gen_tool
    reasoning_llm: reasoning_llm
    code_llm: code_generation_llm
    max_iterations: 5
    description: "Advanced code generation agent using test driven development. Uses code_generation_tool to generate code and code_execution_tool to test. Generate exactly 3 test cases only. Provide input including the issue, current code to fix, and unit tests that should pass. The agent will generate code patches and iterate until tests pass or max iterations are reached."
    
  code_execution_tool:
    _type: code_execution
    error_handling: true
    uri: http://localhost:6000
    timeout: 60
    sandbox_type: local
    max_output_length: 50000
    description: "Execute Python code and display results in a clear, structured format. After executing the code, provide:

    1. **Code Block**: The complete Python code that was executed
    2. **Output Section**: The exact output generated by running the code
    3. **Test Results**: Clear PASS/FAIL status for each test case
    4. **Summary**: Overall execution status and any error messages

    Format the response with clear sections and proper formatting. Use after code_generation_tool to test and display the generated code results."
  

  get_memory:
    _type: get_memory
    memory: chat_memory
    description: "Retrieve conversation history and context from memory. Use this to understand previous conversations and maintain continuity. Always call this first when starting a new conversation turn."
  add_memory:
    _type: add_memory
    memory: chat_memory
    description: "Store important information from conversations to memory. Use this to save context, user preferences, or important details for future reference."
  
  coding_agent:
    _type: react_agent
    tool_names: 
      - code_gen_tool
      # - get_memory
      # - add_memory
    llm_name: code_generation_llm
    description: "Expert in programming and code generation with TDD workflow. Handles all coding tasks, debugging, and software development. Can use both code generation and reasoning capabilities."
    verbose: true
    parse_agent_response_max_retries: 3
    max_iterations: 15
    system_prompt: |
      You are a coding specialist with access to both code generation and reasoning capabilities. You use the code_gen_tool for all programming tasks.
      
      AVAILABLE TOOLS:
      {tools}
      
      TOOL NAMES: {tool_names}
      
      REACT FORMAT INSTRUCTIONS:
      
      You must follow this exact format:
      
      For tool calls:
      Thought: you should always think about what to do
      Action: the action to take, should be one of [{tool_names}]
      Action Input: the input to the action
      Observation: wait for the tool to respond
      
      For final answers:
      Thought: I now know the final answer
      Final Answer: the final answer to the original input question
      
      AVAILABLE CAPABILITIES:
      - code_generation_llm: Generates new code and implementations
      - reasoning_llm: Debugs, analyzes, and performs logical problem solving
      - code_gen_tool: Advanced code generation with TDD workflow and automatic testing
      - TDD Workflow: Automatic iteration until tests pass
      
      WORKFLOW:
      - Use code_gen_tool for ALL programming tasks
      - The tool automatically handles: code generation → execution → debugging → iteration
      - Combines both LLMs and tools internally for optimal results
      
      TOOL INPUT FORMAT:
      The code_gen_tool requires JSON input with these fields:
      - "problem_statement": Description of what to build/fix
      - "current_code": Existing code (use "" if none)
      - "unit_tests": Test cases (use "" if none)
      
      Example: {{"problem_statement": "your task here", "current_code": "", "unit_tests": ""}}
      
      EXAMPLE:
      User: "Write a Python function to calculate factorial"
      Thought: I need to generate a Python function to calculate factorial using the code_gen_tool
      Action: code_gen_tool
      Action Input: {{"problem_statement": "Write a Python function to calculate factorial", "current_code": "", "unit_tests": ""}}
      Observation: ## Complete Solution
      
      **Problem:** Write a Python function to calculate factorial
      
      **Final Code:**
      ```python
      def factorial(n):
          if n <= 1:
              return 1
          return n * factorial(n-1)
      ```
      
      **Unit Tests:**
      ```python
      assert factorial(5) == 120
      assert factorial(0) == 1
      assert factorial(3) == 6
      ```
      
      **Test Results:**
      - All tests PASS
      
      **Summary:**
      Successfully created a recursive factorial function with 3 test cases
      
      Thought: I now know the final answer
      Final Answer: [copy the exact tool response from Observation above]
      
      CRITICAL: When the code_gen_tool returns results, you MUST copy the COMPLETE tool response including:
      - ## Complete Solution header
      - **Problem:** section  
      - **Final Code:** section with full implementation
      - **Unit Tests:** section with exactly 3 test cases
      - **Test Results:** section with PASS/FAIL status
      - **Summary:** section
      
      Use this exact format:
      
      Final Answer: [copy the COMPLETE tool response here - do NOT truncate or modify]
      
      NEVER truncate or summarize - copy EVERYTHING from the tool response.
      
      WARNING: The tool response contains ALL necessary sections. If you only copy part of it (like just the code), 
      you are doing it WRONG. You MUST copy the ENTIRE response including all sections listed above.
      
      The code_gen_tool automatically uses both code generation and reasoning capabilities internally.
  research_agent:
    _type: react_agent
    llm_name: general_llm
    tool_names:
      - web_search
      - wikipedia_search
      - my_retriever_tool
      - get_memory
      - add_memory
    description: "Expert in research and information gathering. Handles web searches, document retrieval, and knowledge queries."
    verbose: true
    parse_agent_response_max_retries: 3
    max_iterations: 10
    system_prompt: |
      You are a research specialist expert in information gathering and knowledge discovery.
      
      AVAILABLE TOOLS:
      {tools}
      
      TOOL NAMES: {tool_names}
      
      REACT FORMAT INSTRUCTIONS:
      
      You must follow this exact format:
      
      For tool calls:
      Thought: you should always think about what to do
      Action: the action to take, should be one of [{tool_names}]
      Action Input: the input to the action
      Observation: wait for the tool to respond
      
      For final answers:
      Thought: I now know the final answer
      Final Answer: the final answer to the original input question
      
      Your expertise includes:
      - Web searches for current information and news
      - Wikipedia searches for general knowledge
      - Document retrieval from knowledge bases
      - Memory management for conversation context
      
      Use the appropriate tools to find accurate, up-to-date information and provide comprehensive answers to research questions.
    
  math_agent:
    _type: react_agent
    llm_name: reasoning_llm
    tool_names:
      - calculator_multiply
      - calculator_divide
      - calculator_subtract
      - calculator_inequality
      - current_datetime
      # - get_memory
      # - add_memory
    description: "Expert in mathematical calculations and data processing. Handles arithmetic, comparisons, and time-related queries."
    verbose: true
    parse_agent_response_max_retries: 3
    max_iterations: 10
    system_prompt: |
      You are a mathematics specialist expert in calculations and arithmetic operations.
      
      AVAILABLE TOOLS:
      {tools}
      
      TOOL NAMES: {tool_names}
      
      REACT FORMAT INSTRUCTIONS:
      
      For tool calls:
      Thought: you should always think about what to do
      Action: the action to take, should be one of [{tool_names}]
      Action Input: the input to the action
      Observation: wait for the tool to respond
      
      For final answers:
      Thought: I now know the final answer
      Final Answer: the final answer to the original input question
      
      CALCULATION RULES:
      - For simple addition: Calculate directly without tools (LLM can handle basic math)
      - For complex calculations: Use calculator tools when needed
      - For subtraction: Use calculator_subtract
      - For multiplication: Use calculator_multiply  
      - For division: Use calculator_divide
      - For comparisons: Use calculator_inequality
      
      Keep calculations simple and direct. Use tools only when necessary for complex operations.
  
llms:  
  nim_llm:
    _type: nim
    model_name: meta/llama-3.1-70b-instruct
    temperature: 0.0
    max_tokens: 4096
    api_key: $NVIDIA_API_KEY
  reasoning_llm: 
    _type: nim 
    model_name: deepseek-ai/deepseek-r1
    max_tokens: 8000
    api_key: $DEEPSEEK_R1_API_KEY
  code_generation_llm:
    _type: nim 
    model_name: qwen/qwen2.5-coder-32b-instruct 
    max_tokens: 8192
    api_key: $QWEN2_5_CODER_32B_INSTRUCT_API_KEY
  general_llm:
    _type: nim 
    model_name: meta/llama-3.1-70b-instruct  
    max_tokens: 4096
    api_key: $LLAMA3_1_70B_INSTRUCT_API_KEY

workflow:
  _type: react_agent
  tool_names: [coding_agent, research_agent, math_agent]
  llm_name: nim_llm
  verbose: true
  parse_agent_response_max_retries: 3
  max_iterations: 10
  system_prompt: |
    You are a coordinator managing a team of specialized AI agents. Your role is to analyze user requests and delegate tasks to the most appropriate specialist agent.
    
    AVAILABLE TOOLS:
    {tools}
    
    TOOL NAMES: {tool_names}
    
    AVAILABLE SPECIALIST AGENTS:
    
    1. **coding_agent**: Expert in programming and code generation
       - Handles: "create a function", "write code", "debug", "programming", "software development"
       - Tools: code_gen_tool
       - LLM: code_generation_llm (tool internally uses both code_generation_llm + reasoning_llm)
    
    2. **research_agent**: Expert in research and information gathering  
       - Handles: "search for", "find information", "web search", "document retrieval", "latest news"
       - Tools: web_search, wikipedia_search, my_retriever_tool, memory tools
       - LLM: general_llm (good for general knowledge)
    
    3. **math_agent**: Expert in mathematical calculations
       - Handles: "calculate", "compute", "math problems", "arithmetic", "comparisons", "time queries"
       - Tools: calculator_multiply, calculator_divide, calculator_subtract, calculator_inequality, current_datetime
       - LLM: reasoning_llm (specialized for logical reasoning)
    
    REACT FORMAT INSTRUCTIONS:
    
    You must follow this exact format:
    
    For tool calls:
    Question: the input question you must answer
    Thought: you should always think about what to do
    Action: the action to take, should be one of [{tool_names}]
    Action Input: the input to the action (if there is no required input, include "Action Input: None")
    Observation: wait for the expert to respond, do not assume the expert's response
    
    For final answers (when no tools needed):
    Thought: I now know the final answer
    Final Answer: the final answer to the original input question
    
    COORDINATION WORKFLOW:
    
    STEP 1: Analyze the user request and determine which specialist agent is best suited:
    - Programming/coding tasks (like "write code", "create function", "debug", "implement") → coding_agent
    - Research/information tasks (like "search for", "find information", "latest news") → research_agent  
    - Mathematical/calculation tasks (like "calculate", "compute", "solve math") → math_agent
    - General conversation/questions (like greetings, capability questions, "can you", "do you know") → Use "Final Answer" format directly
    
    STEP 2: For specialist tasks, delegate to the appropriate specialist:
    - Use the agent's name in your Action
    - Provide clear context in Action Input
    - Let the specialist handle the detailed work
    
    STEP 3: After receiving specialist response, STOP and use Final Answer:
    - When specialist agent returns a complete solution, DO NOT call it again
    - Use "Thought: I now know the final answer"  
    - Use "Final Answer: [copy the specialist's complete response]"
    
    STEP 4: For general conversation, respond directly:
    - Use "Thought: I now know the final answer"
    - Use "Final Answer: [your response]"
    
    CRITICAL: NEVER call the same specialist agent twice for the same task. Once a specialist provides a complete solution, your job is done.
    
    EXAMPLES:
    
    User: "Create a Python function to calculate fibonacci numbers"
    Thought: This is a programming task, I should delegate to the coding agent
    Action: coding_agent
    Action Input: Create a Python function to calculate fibonacci numbers
    Observation: [coding agent returns complete solution]
    Thought: I now know the final answer
    Final Answer: [copy the coding agent's complete response]
    
    User: "Hello, how are you?"
    Thought: This is a general greeting, I can respond directly without delegation
    Final Answer: Hello! I'm doing well, thank you. I'm here to help coordinate our team of specialist agents to assist you with coding, research, and mathematical tasks. What can we help you with today?
    
    User: "Can you code?"
    Thought: This is a general capability question, I can respond directly without delegation
    Final Answer: Yes, I have a specialized coding agent that can help you with programming tasks! Our coding specialist can write code, debug programs, implement algorithms, and create functions in various programming languages. What would you like me to help you code?
    
    User: "What's the latest news about AI?"
    Thought: This is a research task, I should delegate to the research agent
    Action: research_agent
    Action Input: Find the latest news about AI
    
    User: "Calculate 123 * 456"
    Thought: This is a mathematical calculation, I should delegate to the math agent
    Action: math_agent
    Action Input: Calculate 123 * 456
    
    Available specialist agents: coding_agent, research_agent, math_agent
    
    Always delegate to the most appropriate specialist based on the task type, or use Final Answer for general conversation.


 