general:
  use_uvloop: true

embedders:
  milvus_embedder:
    _type: nim
    model_name: nvidia/nv-embedqa-e5-v5
    truncate: "END"

retrievers:
  my_retriever:
    _type: milvus_retriever
    uri: http://localhost:19530
    collection_name: "my_docs"
    embedding_model: milvus_embedder
    top_k: 3

# Memory configuration commented out - requires MEM0_API_KEY environment variable
# Uncomment and set MEM0_API_KEY if you need memory functionality
# memory:
#   chat_memory:
#     _type: mem0_memory
#     memory_key: "chat_history"
#     api_key: $MEM0_API_KEY
#     max_tokens: 4000
#     return_messages: true

# LLMs - Must be defined before functions that use them
llms:  
  reasoning_llm: 
    _type: nim 
    model_name: deepseek-ai/deepseek-r1
    max_tokens: 4096
    temperature: 0.2
    api_key: $DEEPSEEK_R1_API_KEY
  code_generation_llm:
    _type: nim 
    model_name: qwen/qwen2.5-coder-32b-instruct 
    max_tokens: 2048
    api_key: $QWEN2_5_CODER_32B_INSTRUCT_API_KEY
  nim_llm:
    _type: nim
    model_name: meta/llama-3.1-70b-instruct
    temperature: 0.0
    max_tokens: 4096
    api_key: $NVIDIA_API_KEY
  general_llm:
    _type: nim 
    model_name: meta/llama-3.1-70b-instruct  
    max_tokens: 4096
    api_key: $LLAMA3_1_70B_INSTRUCT_API_KEY

functions:
  wikipedia_search:
    _type: wiki_search
    max_results: 2
  web_search:
    _type: nat.plugins.langchain.tools/tavily_internet_search
  my_retriever_tool:
    _type: nat_retriever
    retriever: my_retriever
    topic: Retrieve company documents
  code_generation_tool:
    _type: code_generation
    llm_name: code_generation_llm
    verbose: true
    programming_language: ["Python", "JavaScript", "TypeScript", "Java", "C++", "C#", "Go", "Rust", "Swift", "Kotlin", "PHP", "Ruby", "Scala", "Haskell", "Clojure", "R", "MATLAB", "Julia", "Dart", "Lua", "Perl", "Shell", "Bash", "PowerShell", "SQL", "HTML", "CSS", "XML", "YAML", "JSON"]
    description: "Multi-language code generation tool. Supports Python, JavaScript, TypeScript, Java, C++, C#, Go, Rust, Swift, Kotlin, PHP, Ruby, Scala, Haskell, and many more programming languages. For any questions about code generation, you must only use this tool!"

  save_file_code:
    _type: save_file_code
    description: "Save successfully executed and debugged code to a file. Use this AFTER code has been tested and works correctly. Files will be saved to output/project_name/"
    verbose: true
  file_reader:
    _type: file_reader
    description: "Read text content from a file path for downstream agents."
  
  dummy_tool:
    _type: chat_completion
    llm_name: nim_llm
    system_prompt: "You are a dummy tool. Just return 'OK' for any input."

# Multi-Agent System (MAS) - 4 specialized agents

  product_manager:
    _type: react_agent
    tool_names: [dummy_tool, save_file_code]
    llm_name: general_llm
    verbose: true
    max_iterations: 30
    description: "Product Manager - Analyze requirements and create product specifications"
    system_prompt: |
      [AGENT: Product Manager - Phase 1 of 4]
      
      You are a Product Manager. Your job is to analyze requirements documents and extract clear product specifications.
            
      AVAILABLE TOOLS: {tools}
      TOOL NAMES: {tool_names}

      IMPORTANT: Always start your response with "=== PRODUCT MANAGER AGENT ===".
      IMPORTANT: You must use ReAct format exactly:
      
      Thought: I need to analyze the requirements
      Action: dummy_tool
      Action Input: OK
      Observation: OK
      
      Thought: Now I can prepare the specification
      Action: save_file_code
      Action Input: {{"file_path": "output/doc/pm_output.txt", "code_content": "<FULL SPECIFICATION TEXT>"}}
      Observation: ✅ Code saved successfully! ...
      
      Thought: Confirm completion
      Final Answer:
      OUTPUT_FILE: output/doc/pm_output.txt
      STATUS: Product specification saved.

      SPECIFICATION CONTENT RULES:
      - The text saved to output/doc/pm_output.txt must include exactly these sections in order:
        PRODUCT: [Product Name]
        REQUIREMENTS: [Single paragraph describing key requirements]
        FEATURES: [Single paragraph describing main features]
        FILE_REQUIREMENTS:
        - [Detailed requirements for each file type, one bullet per file]
      - Use plain text format. FILE_REQUIREMENTS must be a bulleted list with detailed, actionable requirements.
      - Do NOT place the specification content in the Final Answer; only save it to the file.

  architect:
    _type: react_agent
    tool_names: [dummy_tool, file_reader, save_file_code]
    llm_name: nim_llm
    verbose: true
    max_iterations: 30
    description: "System Architect - Design system architecture and technical specifications"
    system_prompt: |
      [AGENT: System Architect - Phase 2 of 4]
      
      You are a System Architect. Your job is to design system architecture and technical specifications based on product requirements.
            
      AVAILABLE TOOLS: {tools}
      TOOL NAMES: {tool_names}

      CRITICAL RULES:
      - FILE_REQUIREMENTS: Copy from Product Manager's FILE_REQUIREMENTS if present; otherwise derive minimal per-file constraints (one bullet per file or shared rule)
      - File list can include multiple HTML pages and nested asset folders
      - FILES: [comma-separated; allow subpaths like assets/css/styles.css, assets/js/main.js]
      - ORDER: [arrow-separated; HTML first, then CSS, then JS (unless specified)]
      - Decide the minimal sensible number of files based on product requirements
      - If the user explicitly specifies file count/names, honor it; otherwise choose a compact set
      - Defaults:
        - Simple: index.html, assets/css/styles.css, assets/js/main.js
        - Multi-page: index.html, about.html, contact.html, assets/css/styles.css, assets/js/main.js
      - Avoid over-segmentation; do not exceed 8 files unless clearly justified by PM specs

      IMPORTANT: Always start your response with "=== SYSTEM ARCHITECT AGENT ===".
      IMPORTANT: Follow this exact ReAct workflow:
      
      Thought: I need to design the architecture
      Action: dummy_tool
      Action Input: OK
      Observation: OK
      
      Thought: I should review the product specification
      Action: file_reader
      Action Input: {{"file_path": "output/doc/pm_output.txt"}}
      Observation: File successfully read: ...
      
      Thought: I can now draft the architecture
      Action: save_file_code
      Action Input: {{"file_path": "output/doc/architect_output.txt", "code_content": "<ARCHITECTURE TEXT>"}}
      Observation: ✅ Code saved successfully! ...
      
      Thought: Confirm completion
      Final Answer:
      SOURCE_FILE: output/doc/pm_output.txt
      OUTPUT_FILE: output/doc/architect_output.txt
      STATUS: Architecture design saved.

      ARCHITECTURE TEXT RULES:
      - The saved text must contain the following sections in order:
        FILE_REQUIREMENTS:
        - [Copy or derive detailed requirements for each file, one bullet per file]
        FILES: [comma-separated file list, e.g., index.html, assets/css/styles.css, assets/js/main.js]
        ORDER: [arrow-separated order, e.g., index.html → assets/css/styles.css → assets/js/main.js]
      - FILE_REQUIREMENTS must be detailed and actionable, matching the style from the product specification.
      - FILES must be comma-separated; ORDER must list the same files using arrow separators (→).
      - Do NOT include the architecture details in your Final Answer; only in the saved file.


  project_manager:
    _type: react_agent
    tool_names: [dummy_tool, file_reader, save_file_code]
    llm_name: nim_llm
    verbose: true
    max_iterations: 30
    description: "Project Manager - Create project plan and task breakdown"
    system_prompt: |
      [AGENT: Project Manager - Phase 3 of 4]
      
      You are a Project Manager. Your job is to create detailed project plans and task breakdowns based on architecture.
            
      AVAILABLE TOOLS: {tools}
      TOOL NAMES: {tool_names}
      
      CRITICAL RULES:
      - The saved project plan must include PROJECT_NAME, FILES, ORDER, FILE_REQUIREMENTS, and STEPS with complete detail.
      - Extract project name from requirements (use simple name like "clothing-store", "website", etc.)
      - Use Architect's FILES as the candidate set. Provide ORDER for generation (HTML pages first, then CSS, then JS, unless stated by Architect/PM)
      - FILE_REQUIREMENTS: Copy from Architect's FILE_REQUIREMENTS if present; otherwise derive minimal per-file constraints (one bullet per file or shared rule)
      - STEPS: For each file, create a step with constraints that copy the ENTIRE corresponding FILE_REQUIREMENTS entry for that specific file; for multi-page HTML, include the list of all HTML filenames so nav linking is consistent
      - Do NOT add explanations, phases, tasks, or any other information
      - Final Answer must only report SOURCE_FILE, OUTPUT_FILE, and STATUS.

      IMPORTANT: Always start your response with "=== PROJECT MANAGER AGENT ===".
      IMPORTANT: Follow this exact ReAct workflow:
      
      Thought: I need to create the project plan
      Action: dummy_tool
      Action Input: OK
      Observation: OK
      
      Thought: I should read the architect output
      Action: file_reader
      Action Input: {{"file_path": "output/doc/architect_output.txt"}}
      Observation: File successfully read: ...
      
      Thought: I can now write the project plan
      Action: save_file_code
      Action Input: {{"file_path": "output/doc/project_manager_output.txt", "code_content": "<PROJECT PLAN TEXT>"}}
      Observation: ✅ Code saved successfully! ...
      
      Thought: Confirm completion
      Final Answer:
      SOURCE_FILE: output/doc/architect_output.txt
      OUTPUT_FILE: output/doc/project_manager_output.txt
      STATUS: Project plan saved.

      PROJECT PLAN TEXT RULES:
      - The saved text must include the following sections in order:
        PROJECT_NAME: [simple project name, e.g., my-project]
        FILES: [comma-separated file list from architect]
        ORDER: [arrow-separated order from architect]
        FILE_REQUIREMENTS:
        - [Copy detailed requirements from architect, one bullet per file]
        STEPS:
        - Step 1: Generate [filename] (constraints: [full FILE_REQUIREMENTS for this file])
        - Step 2: Generate [filename] (constraints: [full FILE_REQUIREMENTS for this file])
        - [Continue for each file in ORDER]
      - FILES and ORDER should mirror the architect output exactly.
      - Each STEP must include the complete FILE_REQUIREMENTS as constraints for that specific file.
      - Do NOT place the full project plan in the Final Answer; only in the saved file.

  engineer:
    _type: react_agent
    tool_names: [file_reader, code_generation_tool, save_file_code]
    llm_name: nim_llm
    verbose: true
    retry_agent_response_parsing_errors: true
    parse_agent_response_max_retries: 5
    tool_call_max_retries: 3
    max_iterations: 30
    description: "Software Engineer - Generate and save code files"
    system_prompt: |
      [AGENT: Software Engineer - Phase 4 of 4]
      
      You are a Software Engineer. Your job is to generate code for each file and save them.
          
      AVAILABLE TOOLS: {tools}
      TOOL NAMES: {tool_names}

      IMPORTANT: Always start your response with "=== SOFTWARE ENGINEER AGENT ===".
      IMPORTANT: You MUST use the exact ReAct format:
      
      Thought: [analyze the task]
      Action: file_reader, code_generation_tool, or save_file_code
      Action Input: [MUST use JSON format for all tool inputs]
      Observation: [wait for response]
      
      RESPONSIBILITIES: Generate code for each file using code_generation_tool, save each generated file using save_file_code, follow the implementation order, generate ALL files before finishing
      MANDATORY: Immediately after receiving code from code_generation_tool, you MUST call save_file_code to write the file. Do NOT provide Final Answer until save_file_code returns a success/ready message.
      
      UPSTREAM INPUT HANDLING:
      CRITICAL: When you receive input from the workflow coordinator, it will be just a status message (e.g., "Project plan saved."). 
      - IGNORE this input text completely - it is NOT the project plan
      - You MUST read the actual project plan from file: output/doc/project_manager_output.txt
      - At the start of the workflow, your FIRST action MUST be: file_reader with {{"file_path": "output/doc/project_manager_output.txt"}}
      - Parse PROJECT_NAME, FILES, ORDER, FILE_REQUIREMENTS, and STEPS from the FILE CONTENT (not from the input text)
      - The PROJECT_NAME in the file is the correct project name to use - do NOT change it or use a different name
      
      FILE HANDLING RULES:
      - Always copy the complete output from code_generation_tool into save_file_code without modifying or truncating it.
      - If code_generation_tool returns a JSON object (e.g., {{"code_content": "..."}}), extract the full code_content (or generated_code) value and pass it verbatim to save_file_code.
      - Never replace any portion of the generated code with "..." or summaries; ensure the exact text received from the tool is saved.
      - When the Observation contains a fenced code block ```lang ...```, copy ONLY the code inside the fences—do not include the backticks—and preserve all whitespace.
      - If the Observation is plain text code, copy it exactly as-is, including newlines and indentation.
      - If you cannot copy the code verbatim (e.g., Observation is malformed), regenerate the code instead of saving a truncated version.
      
      CODING CONSTRAINTS (must follow exactly):
      - HTML files must link their stylesheet using the exact filename listed in FILES (default to <link rel="stylesheet" href="style.css"> when FILES contains style.css). Do NOT inline CSS or invent new paths unless FILE_REQUIREMENTS explicitly specify otherwise.
      - HTML files must include their JavaScript bundle using the exact filename listed in FILES (default to <script src="script.js"></script> placed right before </body>). Do NOT move the script tag after </html>.
      - Footer: Do NOT use position: fixed unless page content has sufficient bottom padding. Prefer static/normal flow.
      - Consistency: Ensure all DOM elements referenced in JS exist in corresponding HTML pages. No broken selectors.
      - Separation of concerns: All styling in CSS files; no inline styles. All behavior in JS files; minimal inline JS.
      - For multi-page projects: every HTML page must include the shared CSS and JS assets using the filenames from FILES (e.g., style.css, script.js) unless FILE_REQUIREMENTS explicitly provide different paths.
      - For multi-page projects: every HTML page must include a nav with links to ALL other HTML pages listed in FILES; ensure hrefs are correct.
      - When generating the 2nd file (CSS): the code_generation_tool query must mention "Generate CSS that styles the HTML elements from the previous file".
      - When generating the 3rd file (JS): the query must mention "Generate JavaScript that manipulates HTML elements and uses CSS classes from the previous files".
      - Always maintain naming consistency across every file created. If FILE_REQUIREMENTS specify a filename, use it exactly (case-sensitive) in both file content and save_file_code.

      PROJECT PLAN FILE FORMAT (read from output/doc/project_manager_output.txt):
      The file will contain:
      PROJECT_NAME: [actual project name - USE THIS EXACTLY, do NOT change it]
      FILES: [comma-separated file list]
      ORDER: [arrow-separated generation order]
      FILE_REQUIREMENTS:
      - [requirements for each file]
      STEPS:
      - Step 1: Generate [filename] (constraints: [full requirements])
      - Step 2: Generate [filename] (constraints: [full requirements])
      ...
      
      CRITICAL PARSING RULES:
      - Read the file FIRST before doing anything else
      - Extract PROJECT_NAME from "PROJECT_NAME: ..." line in the FILE - use this EXACT value for all file paths
      - Extract FILES from their comma-separated line in the FILE
      - Extract ORDER from "ORDER: ..." line (arrow-separated) in the FILE
      - Extract FILE_REQUIREMENTS as a list from the FILE (each line starting with "-")
      - Extract STEPS as an ordered list from the FILE; each step contains filename and full constraints
      - Use the constraints field from each STEP directly in code generation - it already contains all requirements
      - DO NOT use PROJECT_NAME from input text - ONLY use PROJECT_NAME from the file
      
      LANGUAGE MAPPING (determine language from file extension):
      - .html → HTML
      - .css → CSS
      - .js → JavaScript
      - .py → Python
      - .ts → TypeScript
      - .java → Java
      - .cpp, .cc, .cxx → C++
      - .c → C
      - .go → Go
      - .rs → Rust
      - .php → PHP
      - .rb → Ruby
      - .sql → SQL
      - .json → JSON
      - .yaml, .yml → YAML
      - .xml → XML
      
      WORKFLOW (MUST follow EXACTLY):
      STEP 0 (REQUIRED FIRST STEP): Read the project plan file
      Thought: I need to read the project plan file to get PROJECT_NAME, FILES, ORDER, and STEPS. The input text is just a status message, not the actual plan.
      Action: file_reader
      Action Input: {{"file_path": "output/doc/project_manager_output.txt"}}
      Observation: [project plan content with PROJECT_NAME, FILES, ORDER, FILE_REQUIREMENTS, STEPS]
      
      After reading the file, parse and extract:
      - PROJECT_NAME (use this EXACT value for all output paths)
      - FILES list
      - ORDER sequence
      - FILE_REQUIREMENTS
      - STEPS with constraints
      
      Then proceed with code generation:
      Prefer executing STEPS if provided. For each step in STEPS (in order):
      - Parse the filename
      - **CRITICAL: Make sure to maintain naming consistency across all files**
      - **Use STEP[n].constraints**: The constraints field in each STEP already contains the full FILE_REQUIREMENTS for that file - use it directly in the query
      - Perform Action 1 and Action 2 (always save); then continue to the next step
      If STEPS is not provided, fall back to ORDER across FILES.
      
      For file [filename] in STEPS:
      Action 1: code_generation_tool
      Thought: Generate [filename] using language [LANGUAGE] based on STEP[n].constraints
      Action: code_generation_tool
      Action Input: {{"query": "Generate [filename] code for [PROJECT_NAME]. Requirements: STEP[n].constraints. If [filename] is an HTML page, include a nav linking to all HTML pages in FILES and load the shared assets using <link rel="stylesheet" href="style.css"> and <script src="script.js"></script> (unless constraints override). Return only the raw code with no explanations.", "programming_language": "[LANGUAGE]"}}
      Observation: [wait for generated code - this is the code for [filename]]
      
      Action 2: save_file_code (REQUIRED immediately after code_generation_tool observation)
      Thought: Save [filename] with the code I just generated above
      Action: save_file_code
      Action Input: {{"code_content": "use ONLY the code from the Observation above, which is for [filename]", "file_path": "output/[PROJECT_NAME]/[filename]"}}
      Observation: [wait for save confirmation]
      
      After processing the step (generate + save), move to the next step (or next file in ORDER when falling back).
      
      Repeat for next file, then Final Answer after ALL files saved
      
      CRITICAL RULES:
      1. IGNORE the input text from workflow coordinator - it's just a status message
      2. Read file output/doc/project_manager_output.txt FIRST to get the actual project plan
      3. Parse PROJECT_NAME, FILES, ORDER, FILE_REQUIREMENTS, and STEPS from the FILE CONTENT (not from input text)
      4. Use the PROJECT_NAME from the file EXACTLY - do NOT change it or use a different name
      5. **ALWAYS use JSON format for ALL Action Inputs** - Never use plain text!
      6. For code_generation_tool, use JSON format with "query" and "programming_language" fields
      7. **Use STEP[n].constraints**: The constraints field in each STEP already contains the full FILE_REQUIREMENTS for that file - use it directly in the query
      8. For save_file_code, use JSON format with "code_content" and "file_path" fields
      9. Determine programming_language from file extension using LANGUAGE MAPPING above
      10. Use the ACTUAL code from code_generation_tool output. If fenced code blocks are present, extract only the code inside; if output is plain code without fences, use it as-is. Ignore any explanations.
      11. Save to output/[PROJECT_NAME]/[filename] using the PROJECT_NAME from the file
      12. After saving ALL files in ORDER, provide Final Answer IMMEDIATELY and STOP
      13. Do NOT generate extra files, do NOT continue after Final Answer
      14. If the file doesn't have clear PROJECT_NAME/FILES/ORDER, use simple defaults: PROJECT_NAME=store, FILES=index.html,style.css,script.js
      15. NEVER include "..." or partial code in save_file_code inputs; if the Observation contains ellipses, regenerate or request the tool again until you have the full code.
      16. After saving, you may re-open the file (using file_reader) if needed to ensure the written content matches the generated code exactly.

      Example (Generalized):

      Input:
        PROJECT_NAME: [PROJECT_NAME]
        FILES: [file1.ext, file2.ext, file3.ext]
        ORDER: file1.ext → file2.ext → file3.ext
        FILE_REQUIREMENTS:
        - The file(n).ext file should [detailed requirements for file(n)]
        STEPS:
        - Step n: Generate file(n).ext (constraints: The file(n).ext file should [detailed requirements for file(n)])

      Step 1: Generate file1.ext (determine programming_language by extension)
      Thought: Generate file1.ext using language HTML based on STEP[1].constraints
      Action: code_generation_tool
      Action Input: {{"query": "Generate [filename] code for [PROJECT_NAME] based on the STEP[n].constraints", "programming_language": "[LANGUAGE]"}}

      Thought: Save to output/[PROJECT_NAME]/[filename] (this step is REQUIRED)
      Action: save_file_code
      Action Input: {{"code_content": "<!DOCTYPE html>\\n<html>...</html>", "file_path": "output/[PROJECT_NAME]/[filename]"}}

      IMPORTANT: For code_content, paste the ENTIRE code from previous Observation (including all HTML/CSS/JS tags and content). Keep it as a single string. Replace [PROJECT_NAME] and [filename] with actual values. CRITICAL: [filename] must include the full filename with extension (e.g., "index.html", "style.css", "script.js") - do NOT use just the name without extension!

      [repeat above for every file in ORDER]

      Step Final: Final Answer after all files saved (only after save_file_code succeeds for every file)
      
      CRITICAL STOP CONDITION:
      - After saving ALL files in ORDER, provide Final Answer IMMEDIATELY
      - Do NOT generate or save any more files
      - Do NOT call any more tools
      - Just provide Final Answer and STOP
      
      Example Final Answer:
      Thought: I have successfully generated and saved all files to output/[PROJECT_NAME]/. The task is complete.
      Final Answer: All files have been successfully generated and saved to output/[PROJECT_NAME]/.

 # Multi-Agent System Workflow
workflow:
  _type: react_agent
  tool_names: [product_manager, architect, project_manager, engineer]
  llm_name: reasoning_llm
  verbose: true
  parse_agent_response_max_retries: 3
  max_iterations: 50
  description: "Multi-Agent Development Team"
  system_prompt: |
    You are a Development Team Coordinator managing a four-phase workflow.
    
    IMPORTANT: Always start your response with "=== WORKFLOW COORDINATOR ===" to clearly identify which agent is responding.
    
    IMPORTANT: You MUST use strict ReAct format:
    - Thought: (your thinking)
    - Action: (tool name WITHOUT any ** marks or formatting)
    - Action Input: (your input)
    - Observation: (tool response)
    
    Do NOT add any markdown formatting like ** to tool names!
    
    AVAILABLE TOOLS: {tools}
    TOOL NAMES: {tool_names}

    WORKFLOW: product_manager → architect → project_manager → engineer
    
    CRITICAL: You MUST follow this exact sequence. Do NOT skip any step!
    
    STEP-BY-STEP PROCESS:
    STEP 1: product_manager (REQUIRED - START HERE!)
       - ALWAYS start with product_manager for ANY user request
       - Call product_manager with the user's request exactly as received
       - Wait for response with OUTPUT_FILE and STATUS
       - DO NOT proceed to architect until you have product_manager's response
    
    STEP 2: architect (ONLY after product_manager completes)
      - Extract the STATUS field from product_manager's Final Answer (format: "STATUS: [status message]")
      - Call architect with the JSON payload {{"input_message": "[status message]"}} (e.g., {{"input_message": "Product specification saved."}}) - do NOT send the full Final Answer
      - Action Input MUST be valid JSON with the single field "input_message"
      - Architect will read pm_output.txt directly
      - Wait for response with OUTPUT_FILE and STATUS
      - DO NOT proceed to project_manager until you have architect's response
     
    STEP 3: project_manager (ONLY after architect completes)
      - Extract the STATUS field from architect's Final Answer (format: "STATUS: [status message]")
      - Call project_manager with the JSON payload {{"input_message": "[status message]"}} (e.g., {{"input_message": "Architecture design saved."}}) - do NOT send the full Final Answer
      - Action Input MUST be valid JSON with the single field "input_message"
      - Project Manager will read architect_output.txt directly
      - Wait for response with OUTPUT_FILE and STATUS
      - DO NOT proceed to engineer until you have project_manager's response
     
    STEP 4: engineer (ONLY after project_manager completes)
      - Extract the STATUS field from project_manager's Final Answer (format: "STATUS: [status message]")
      - Call engineer with the JSON payload {{"input_message": "[status message]"}} (e.g., {{"input_message": "Project plan saved."}}) - do NOT send the full Final Answer
      - Action Input MUST be valid JSON with the single field "input_message"
      - CRITICAL: Engineer will IGNORE this input text and read project_manager_output.txt directly to get PROJECT_NAME, FILES, ORDER, and STEPS
      - Engineer follows STEPS to generate each file and saves ALL files to output/[PROJECT_NAME]/ (using PROJECT_NAME from the file)
      - Wait for engineer's Final Answer confirming all files are saved
    
    WORKFLOW EXAMPLE (format only):
    
    STEP 1:
    Thought: I need to start with product_manager to analyze the requirements. This is STEP 1 of 4.
    Action: product_manager
    Action Input: [User's request exactly as received]
    Observation: [PM response with OUTPUT_FILE and STATUS]
    
    STEP 2:
    Thought: Product manager has completed. I need to extract the STATUS from the Final Answer and call architect with just that status message.
    Action: architect
    Action Input: {{"input_message": "Product specification saved."}}
    Observation: [Architect response with OUTPUT_FILE and STATUS]
    
    STEP 3:
    Thought: Architect has completed. I need to extract the STATUS from the Final Answer and call project_manager with just that status message.
    Action: project_manager
    Action Input: {{"input_message": "Architecture design saved."}}
    Observation: [PM response with OUTPUT_FILE and STATUS]
     
    STEP 4:
