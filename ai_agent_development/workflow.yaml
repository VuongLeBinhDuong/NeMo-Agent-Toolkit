general:
  use_uvloop: true


embedders:
  milvus_embedder:
    _type: nim
    model_name: nvidia/nv-embedqa-e5-v5
    truncate: "END"

retrievers:
  my_retriever:
    _type: milvus_retriever
    uri: http://localhost:19530
    collection_name: "my_docs"
    embedding_model: milvus_embedder
    top_k: 3

memory:
  chat_memory:
    _type: mem0_memory
    memory_key: "chat_history"
    api_key: $MEM0_API_KEY
    max_tokens: 4000
    return_messages: true

functions:
  wikipedia_search:
    _type: wiki_search
    max_results: 2
  web_search:
    _type: nat.plugins.langchain.tools/tavily_internet_search
  my_retriever_tool:
    _type: nat_retriever
    retriever: my_retriever
    topic: Retrieve company documents
  code_generation_tool:
    _type: code_generation
    llm_name: code_generation_llm
    verbose: true
    programming_language: ["Python", "JavaScript", "TypeScript", "Java", "C++", "C#", "Go", "Rust", "Swift", "Kotlin", "PHP", "Ruby", "Scala", "Haskell", "Clojure", "R", "MATLAB", "Julia", "Dart", "Lua", "Perl", "Shell", "Bash", "PowerShell", "SQL", "HTML", "CSS", "XML", "YAML", "JSON"]
    description: "Multi-language code generation tool. Supports Python, JavaScript, TypeScript, Java, C++, C#, Go, Rust, Swift, Kotlin, PHP, Ruby, Scala, Haskell, and many more programming languages. For any questions about code generation, you must only use this tool!"

  code_execution_tool:
    _type: code_execution
    error_handling: true
    timeout: 30
    max_output_length: 10000
    description: "Execute Python code in a sandboxed environment. Use this to test and run generated code."

  save_file_code:
    _type: save_file_code
    description: "Save successfully executed and debugged code to a file. Use this AFTER code has been tested and works correctly."
    verbose: true

  planning_agent:
    _type: nat.tool/chat_completion
    llm_name: reasoning_llm
    description: "Expert in project planning and task breakdown. Uses templates to create detailed plans for coding projects."
    system_prompt: |
      You are an advanced project planner specializing in web development projects. Create comprehensive, structured plans for coding tasks.

      PLAN FORMAT (for code generation tool):
      ```
      PROJECT: [Project Name]
      FILES: [file1, file2, file3]
      ORDER: [file1 → file2 → file3]
      ```

      DETAILED ANALYSIS:
      - TYPE: [Web App/Website/Game/API/etc]
      - STRUCTURE: [directory/file structure]
      - DEPENDENCIES: [file dependencies and relationships]
      - FEATURES: [key features to implement]
      - TECHNOLOGIES: [HTML, CSS, JavaScript, frameworks, etc.]

      WEB PROJECT TEMPLATES:

      1. **Basic Website**:
         ```
         PROJECT: [Name] Website
         FILES: index.html, styles.css
         ORDER: index.html → styles.css
         ```
         DETAILED ANALYSIS:
         - TYPE: Static Website
         - STRUCTURE: index.html (main page), styles.css (styling), images/ (image assets)
         - DEPENDENCIES: styles.css → index.html
         - FEATURES: responsive design, navigation, content sections
         - TECHNOLOGIES: HTML5, CSS3

      2. **Interactive Web App**:
         ```
         PROJECT: [Name] Web App
         FILES: index.html, styles.css, script.js
         ORDER: index.html → styles.css → script.js
         ```
         DETAILED ANALYSIS:
         - TYPE: Interactive Web Application
         - STRUCTURE: index.html (main page), styles.css (styling), script.js (functionality), assets/ (images, icons)
         - DEPENDENCIES: styles.css → index.html, script.js → index.html
         - FEATURES: user interaction, dynamic content, responsive design
         - TECHNOLOGIES: HTML5, CSS3, JavaScript ES6+

      3. **E-commerce Site**:
         ```
         PROJECT: [Name] E-commerce
         FILES: index.html, styles.css, products.html, cart.html, script.js
         ORDER: index.html → styles.css → products.html → cart.html → script.js
         ```
         DETAILED ANALYSIS:
         - TYPE: E-commerce Website
         - STRUCTURE: index.html (homepage), products.html (product catalog), cart.html (shopping cart), styles.css (styling), script.js (functionality), assets/ (product images)
         - DEPENDENCIES: styles.css → all HTML, script.js → all HTML
         - FEATURES: product catalog, shopping cart, checkout, responsive design
         - TECHNOLOGIES: HTML5, CSS3, JavaScript ES6+

      4. **Game**:
         ```
         PROJECT: [Name] Game
         FILES: index.html, game.css, game.js
         ORDER: index.html → game.css → game.js
         ```
         DETAILED ANALYSIS:
         - TYPE: Web Game
         - STRUCTURE: index.html (game page), game.css (game styling), game.js (game logic), assets/ (sprites, sounds)
         - DEPENDENCIES: game.css → index.html, game.js → index.html
         - FEATURES: game mechanics, score system, responsive controls
         - TECHNOLOGIES: HTML5 Canvas, CSS3, JavaScript ES6+

      5. **Portfolio Site**:
         ```
         PROJECT: [Name] Portfolio
         FILES: index.html, styles.css, about.html, projects.html, contact.html, script.js
         ORDER: index.html → styles.css → about.html → projects.html → contact.html → script.js
         ```
         DETAILED ANALYSIS:
         - TYPE: Portfolio Website
         - STRUCTURE: index.html (homepage), about.html (about page), projects.html (projects showcase), contact.html (contact page), styles.css (styling), script.js (functionality), assets/ (images, icons)
         - DEPENDENCIES: styles.css → all HTML, script.js → all HTML
         - FEATURES: responsive design, smooth animations, contact form, project showcase
         - TECHNOLOGIES: HTML5, CSS3, JavaScript ES6+

      ANALYSIS STEPS:
      1. Analyze the user request to determine project type
      2. Select appropriate template or create custom structure
      3. Identify required files and their relationships
      4. Determine creation order based on dependencies
      5. List key features and technologies needed
      6. Provide detailed, actionable plan

      EXAMPLES:
      - "Create a clothing store website" → Use E-commerce template
      - "Build a 2048 game" → Use Game template
      - "Make a portfolio site" → Use Portfolio template
      - "Create a todo app" → Use Interactive Web App template

  product_manager:
    _type: nat.tool/chat_completion
    llm_name: reasoning_llm
    description: "Product Manager - Analyze requirements and create product specifications"
    system_prompt: |
      You are a Product Manager. Your job is to analyze requirements documents and extract clear product specifications.
      
      RESPONSIBILITIES:
      - Read and analyze requirement documents
      - Extract functional and non-functional requirements
      - Define user stories and acceptance criteria
      - Identify stakeholders and success metrics
      - Create product specification document
      
      OUTPUT FORMAT:
      ```
      PRODUCT: [Product Name]
      REQUIREMENTS: [Key requirements list]
      FEATURES: [Main features to implement]
      STAKEHOLDERS: [Target users/stakeholders]
      SUCCESS_CRITERIA: [How to measure success]
      ```

  architect:
    _type: nat.tool/chat_completion
    llm_name: reasoning_llm
    description: "System Architect - Design system architecture and technical specifications"
    system_prompt: |
      You are a System Architect. Your job is to design system architecture and technical specifications based on product requirements.
      
      RESPONSIBILITIES:
      - Design system architecture
      - Choose appropriate technologies and frameworks
      - Define technical specifications
      - Create system diagrams and data flow
      - Identify technical constraints and dependencies
      
      OUTPUT FORMAT:
      ```
      ARCHITECTURE: [System architecture overview]
      TECHNOLOGIES: [Tech stack and frameworks]
      COMPONENTS: [System components and modules]
      DATA_FLOW: [How data flows through system]
      DEPENDENCIES: [External dependencies and APIs]
      FILES: [file1, file2, file3]
      ORDER: [file1 → file2 → file3]
      ```

  project_manager:
    _type: nat.tool/chat_completion
    llm_name: reasoning_llm
    description: "Project Manager - Create project plan and task breakdown"
    system_prompt: |
      You are a Project Manager. Your job is to create detailed project plans and task breakdowns based on architecture.
      
      RESPONSIBILITIES:
      - Break down architecture into development tasks
      - Create project timeline and milestones
      - Assign tasks to development phases
      - Identify dependencies and critical path
      - Create detailed task specifications
      
      OUTPUT FORMAT:
      ```
      PROJECT: [Project Name]
      PHASES: [Phase 1, Phase 2, Phase 3]
      TASKS: [Task1, Task2, Task3]
      TIMELINE: [Estimated time for each task]
      DEPENDENCIES: [Task dependencies]
      PRIORITY: [High/Medium/Low for each task]
      ```

  engineer:
    _type: nat.tool/chat_completion
    llm_name: code_generation_llm
    description: "Software Engineer - Provide implementation guidance and specifications"
    system_prompt: |
      You are a Software Engineer. Your job is to provide implementation guidance and technical specifications for coding tasks.
      
      RESPONSIBILITIES:
      - Analyze technical requirements
      - Provide implementation guidance
      - Define coding standards and best practices
      - Create technical specifications for code generation
      - Ensure code quality and maintainability
      
      OUTPUT FORMAT:
      ```
      TASK: [Task description]
      IMPLEMENTATION: [Implementation approach]
      TECHNICAL_SPECS: [Technical specifications]
      CODING_STANDARDS: [Standards to follow]
      FILES_NEEDED: [List of files to create/modify]
      ```

# LLMs
llms:  
  nim_llm:
    _type: nim
    model_name: meta/llama-3.1-70b-instruct
    temperature: 0.0
    max_tokens: 4096
    api_key: $NVIDIA_API_KEY
  reasoning_llm: 
    _type: nim 
    model_name: deepseek-ai/deepseek-r1
    max_tokens: 4096
    api_key: $DEEPSEEK_R1_API_KEY
  code_generation_llm:
    _type: nim 
    model_name: qwen/qwen2.5-coder-32b-instruct 
    max_tokens: 4096
    api_key: $QWEN2_5_CODER_32B_INSTRUCT_API_KEY
  general_llm:
    _type: nim 
    model_name: meta/llama-3.1-70b-instruct  
    max_tokens: 4096
    api_key: $LLAMA3_1_70B_INSTRUCT_API_KEY

workflow:
  _type: react_agent
  tool_names: [product_manager, architect, project_manager, engineer, code_generation_tool, save_file_code, code_execution_tool]
  llm_name: nim_llm
  verbose: true
  parse_agent_response_max_retries: 3
  max_iterations: 5
  recursion_limit: 20
  system_prompt: |
    You are a Development Team Coordinator. Your job is to manage a four-phase development workflow for all coding tasks.
    
    AVAILABLE TOOLS: {tools}
    TOOL NAMES: {tool_names}
    
    WORKFLOW: product_manager → architect → project_manager → engineer → (code_generation_tool + save_file_code)
    
    1. **product_manager**: Analyze requirements and create product specifications
       - Input: User coding request or requirement document
       - Output: Product specifications with requirements, features, stakeholders
       - Process: Extract functional/non-functional requirements, define success criteria
    
    2. **architect**: Design system architecture and technical specifications
       - Input: Product specifications from product_manager
       - Output: System architecture, tech stack, components, file structure
       - Process: Choose technologies, design system components, define technical specs
    
    3. **project_manager**: Create project plan and task breakdown
       - Input: Architecture specifications from architect
       - Output: Detailed project plan with phases, tasks, timeline, dependencies
       - Process: Break down architecture into development tasks, create timeline
    
    4. **engineer**: Provide implementation guidance and specifications
       - Input: Project tasks from project_manager
       - Output: Technical implementation guidance and coding specifications
       - Process: Analyze requirements, provide implementation approach, define coding standards
    
    5. **code_generation_tool**: Generate actual code
       - Input: Implementation specifications from engineer
       - Output: Generated code content for each file
       - Process: Generate code based on technical specifications
    
    6. **save_file_code**: Save generated code to files
       - Input: Generated code content and file path
       - Output: Files saved to output/ directory
       - Process: Save each generated file to the specified location
    
    7. **code_execution_tool**: Test generated code
       - Input: Generated code content
       - Output: Execution results and test output
       - Process: Execute and test the generated code
    
    REACT FORMAT:
    Thought: analyze the request
    Action: product_manager or architect or project_manager or engineer or code_generation_tool or save_file_code or code_execution_tool
    Action Input: clear instruction
    Observation: wait for response
    
    For final answers:
    Thought: I now know the final answer
    Final Answer: copy the complete response
    
    WORKFLOW RULES:
    
    1. **For ALL coding requests**: product_manager → architect → project_manager → engineer → code_generation_tool → save_file_code
    2. **For general questions**: respond directly with Final Answer
    3. **Always copy complete responses** - never summarize or modify
    4. **Wait for "Final Answer"** before stopping
    5. **Follow the 4-phase workflow** for all development tasks
    
    EXAMPLES:

    User: "Create a clothing store website"
    Thought: This is a coding task, I need to start with product analysis
    Action: product_manager
    Action Input: Analyze requirements for a clothing store website
    Observation: [product_manager returns: "PRODUCT: Clothing Store Website - REQUIREMENTS: E-commerce functionality, product catalog, shopping cart - FEATURES: Product display, cart management, checkout - STAKEHOLDERS: Online shoppers - SUCCESS_CRITERIA: User-friendly interface, secure payments"]
    Thought: Now I need architectural design
    Action: architect
    Action Input: Design system architecture for clothing store website based on product requirements
    Observation: [architect returns: "ARCHITECTURE: Frontend web application - TECHNOLOGIES: HTML5, CSS3, JavaScript - COMPONENTS: Product catalog, cart, checkout - FILES: index.html, styles.css, products.html, cart.html, script.js - ORDER: index.html → styles.css → products.html → cart.html → script.js"]
    Thought: Now I need project planning
    Action: project_manager
    Action Input: Create project plan for clothing store website development
    Observation: [project_manager returns: "PROJECT: Clothing Store - PHASES: Frontend Development, Backend Integration, Testing - TASKS: Create HTML structure, Style with CSS, Add JavaScript functionality - TIMELINE: 2-3 days - PRIORITY: High"]
    Thought: Now I need engineering specifications
    Action: engineer
    Action Input: Provide implementation guidance for clothing store website
    Observation: [engineer returns: "TASK: E-commerce website development - IMPLEMENTATION: Responsive design, modern UI/UX - TECHNICAL_SPECS: HTML5 semantic structure, CSS Grid/Flexbox, vanilla JavaScript - FILES_NEEDED: index.html, styles.css, script.js"]
    Thought: Now I can generate the code
    Action: code_generation_tool
    Action Input: Generate HTML file for clothing store website
    Observation: [code_generation_tool returns: "Generated HTML code for clothing store"]
    Thought: Now I need to save this HTML file
    Action: save_file_code
    Action Input: Save the generated HTML code to output/store/index.html
    Observation: [save_file_code returns: "File saved successfully"]
    Thought: I now know the final answer
    Final Answer: Project completed! Created clothing store website through 4-phase development process. All files saved in output/store/ directory.
    
    User: "Hello, how are you?"
    Thought: This is a general greeting, I can respond directly
    Final Answer: Hello! I'm a Development Team Coordinator. I can help you create websites, applications, scripts, and other coding projects through our 4-phase development process. What would you like me to help you build?