functions:
  file_reader:
    _type: file_reader
    description: "Read text content from a file path for downstream agents."

  # Code generation tool (dedicated code LLM) - used by worker_step for .js/.css
  code_generation_tool:
    _type: code_generation
    llm_name: code_generation_llm
    verbose: true
    programming_language: ["JavaScript", "HTML", "CSS", "JSON"]
    description: "High-quality front-end code generator for HTML/CSS/JS/JSON. Always returns full, production-ready files with no explanations."

# Multi-Agent System (MAS) V2 - Full flow: Product → Architect → Planner → Worker → Executor → Critic

  # Product Agent (Requirement): clarify request, PRD, acceptance criteria
  product_step:
    _type: product_step
    llm_name: reasoning_llm
    description: "Clarify user request, write short PRD, define acceptance criteria"

  # Architect Agent (Design): file structure, modules, API
  architect_step:
    _type: architect_step
    llm_name: reasoning_llm
    description: "Design modules, file structure, and API from requirement doc"

  # MAS V2 Code Loop Step Functions
  planner_step:
    _type: planner_step
    llm_name: reasoning_llm
    description: "Decompose objective into incremental subtasks or refine plan from critique using reasoning LLM"

  worker_step:
    _type: worker_step
    llm_name: code_generation_llm
    description: "Read files, call LLM to generate or edit code, apply via write_file, update TaskState artifacts"

  executor_step:
    _type: executor_step
    description: "Run tests/shell and record results in TaskState execution_log and last_tests"
    enable_tests: false

  critic_step:
    _type: critic_step
    description: "Analyze execution_log and last_tests; produce structured Critique (root_cause, affected_files, suggested_fix, confidence)"

  # MAS V2 tools (used by worker_step and executor_step)
  list_files:
    _type: nat_mas_agents_v2/list_files
  read_file:
    _type: nat_mas_agents_v2/read_file
  write_file:
    _type: nat_mas_agents_v2/write_file
  run_shell:
    _type: nat_mas_agents_v2/run_shell
  run_test:
    _type: nat_mas_agents_v2/run_test

  # Code loop (Planner → Worker → Executor → Critic) - used inside full_mas_workflow
  code_loop_workflow:
    _type: code_loop_workflow
    planner: planner_step
    worker: worker_step
    executor: executor_step
    critic: critic_step
    max_iterations: 15

# Full MAS Workflow: Product → Architect → Planner → Worker → Executor → Critic
workflow:
  _type: full_mas_workflow
  description: "Full MAS: Product (PRD) → Architect (Design) → code loop until success or failed"
  product: product_step
  architect: architect_step
  code_loop: code_loop_workflow