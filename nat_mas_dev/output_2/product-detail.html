<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Gadget Store - Product Detail</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <a href="index.html" class="header__logo">Tech Gadget Store</a>
        <nav class="header__nav">
            <select id="category-filter"></select>
            <input type="text" id="search-input" placeholder="Search products...">
        </nav>
        <span id="cart-count">0</span> - <span id="cart-subtotal">$0.00</span>
    </header>

    <div class="product-detail">
        <img src="" alt="Product Image" id="product-image">
        <h1 id="product-name"></h1>
        <p id="product-description"></p>
        <p id="product-price"></p>
        <button id="add-to-cart">Add to Cart</button>
    </div>

    <footer class="footer">
        © 2023 Tech Gadget Store. All rights reserved.
    </footer>

    <script src="app.js"></script>
</body>
</html>
