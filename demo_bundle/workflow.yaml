general:
  use_uvloop: true

embedders:
  milvus_embedder:
    _type: nim
    model_name: nvidia/nv-embedqa-e5-v5
    truncate: "END"

retrievers:
  my_retriever:
    _type: milvus_retriever
    uri: http://localhost:19530
    collection_name: "my_docs"
    embedding_model: milvus_embedder
    top_k: 3

functions:
  # calculator_multiply:
  #   _type: calculator_multiply
  # calculator_inequality:
  #   _type: calculator_inequality
  # calculator_divide:
  #   _type: nat_simple_calculator/calculator_divide
  # current_datetime:
  #   _type: current_datetime
  # calculator_subtract:
  #   _type: calculator_subtract
  # wikipedia_search:
  #   _type: wiki_search
  #   max_results: 2
  # web_search:
  #   _type: nat.plugins.langchain.tools/tavily_internet_search
  my_retriever_tool:
    _type: nat_retriever
    retriever: my_retriever
    topic: Retrieve company documents
llms:
  nim_llm:
    _type: nim
    model_name: meta/llama-3.1-70b-instruct
    temperature: 0.0
    max_tokens: 1024
    api_key: $NVIDIA_API_KEY

workflow:
  _type: react_agent
  tool_names:
    # - calculator_multiply
    # - calculator_inequality
    # - current_datetime
    # - calculator_divide
    # - calculator_subtract
    # - wikipedia_search
    # - web_search
    - my_retriever_tool
  llm_name: nim_llm
  verbose: true
  parse_agent_response_max_retries: 3
