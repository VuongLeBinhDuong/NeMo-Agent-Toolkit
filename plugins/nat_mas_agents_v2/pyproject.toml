[project]
name = "nat-mas-agents-v2"
version = "0.1.0"
description = "NAT plugin: MAS V2 coding loop (Planner → Worker → Executor → Critic) with TaskState"
requires-python = ">=3.9"
dependencies = [
    "nvidia-nat",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.entry-points."nat.plugins"]
nat_mas_agents_v2 = "nat_mas_agents_v2.register"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
