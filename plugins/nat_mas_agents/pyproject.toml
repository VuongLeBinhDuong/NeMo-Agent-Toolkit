[project]
name = "nat-mas-agents"
version = "0.1.0"
description = "NAT plugin registering MAS agent wrappers as functions"
requires-python = ">=3.9"
dependencies = [
    "nvidia-nat",
]

[project.entry-points."nat.plugins"]
nat_mas_agents = "nat_mas_agents.register"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"



















































